  reload: "&aKonfiguracja schowka została pomyślnie przeładowana!"
  auto-deposited: "&ePrzeniesiono &6%amount%x %item% &edo schowka &7(Limit: &f%limit%&7)!"
  withdrawn: "&aWypłacono &e%amount%x %item% &aze schowka!"
  withdrawn-all: "&aPomyślnie uzupełniono wszystkie przedmioty do limitu!"
  deposited: "&aWpłacono &e%amount%x %item% &ado schowka!"
  nothing-to-withdraw: "&cTwój schowek dla przedmiotu %item% jest pusty!"
  limit-reached: "&cPosiadasz już pełny limit &e%item% &cw ekwipunku &7(%limit% szt.)&c!"
  inventory-full: "&cTwój ekwipunek jest pełny! Nie można wypłacić więcej przedmiotów."
  usage: "&7Użycie: &e/schowek [dobierz|schowaj|admin|reload]"
  admin-usage: "&7Użycie: &e/schowek admin <gracz> <daj/zabierz/ustaw> <przedmiot> <ilość>"
  admin-success: "&aZaktualizowano schowek gracza &e%player%&a! Przedmiot: &f%item%&a, Ilość: &e%amount%"
