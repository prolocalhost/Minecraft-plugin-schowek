settings:
  # Czy nadmiarowe przedmioty maja byc automatycznie przenoszone do schowka
  # przy podnoszeniu z ziemi, craftingu oraz zamykaniu skrzynek
  auto-schowek-enabled: true

  # Czy alert o schowaniu nadmiarowych przedmiotow ma sie wyswietlac na ActionBarze
  actionbar-alert: true

  # Czas (w minutach) miedzy automatycznymi zapisami danych do pliku
  auto-save-interval: 5

  # Dźwięki
  gui-sound: "UI_BUTTON_CLICK"
  deposit-sound: "ENTITY_ITEM_PICKUP"
  withdraw-sound: "ENTITY_EXPERIENCE_ORB_PICKUP"

# Przedmioty podlegajace limitom i deponowane w schowku
items:
  kox:
    material: "ENCHANTED_GOLDEN_APPLE"
    name: "&6&lKoxy"
    limit: 2
    gui-slot: 11
  refil:
    material: "GOLDEN_APPLE"
    name: "&e&lRefile"
    limit: 12
    gui-slot: 12
  perla:
    material: "ENDER_PEARL"
    name: "&5&lPerły Kresu"
    limit: 4
    gui-slot: 13
  totem:
    material: "TOTEM_OF_UNDYING"
    name: "&e&lTotemy"
    limit: 1
    gui-slot: 14
  strzala:
    material: "ARROW"
    name: "&f&lStrzały"
    limit: 32
    gui-slot: 15

# Konfiguracja Menu Graficznego (/schowek)
gui:
  title: "&8Schowek &7(Depozyt PvP)"
  size: 36
  background:
    material: "GRAY_STAINED_GLASS_PANE"
    name: " "

  restock-button:
    slot: 22
    material: "EMERALD_BLOCK"
    name: "&a&lDOBIERZ WSZYSTKO DO LIMITU"
    lore:
      - "&7Kliknij, aby jednym ruchem uzupełnić"
      - "&7wszystkie przedmioty w Twoim ekwipunku"
      - "&7do maksymalnych dozwolonych limitów!"
      - ""
      - "&8» &eKliknij, aby uzupełnić zapasy!"

  deposit-button:
    slot: 21
    material: "HOPPER"
    name: "&c&lSCHOWAJ NADMIAR"
    lore:
      - "&7Kliknij, aby natychmiast przenieść"
      - "&7wszystkie nadmiarowe przedmioty z Twojego"
      - "&7ekwipunku do wirtualnego schowka."
      - ""
      - "&8» &eKliknij, aby schować nadmiar!"

  info-button:
    slot: 23
    material: "NETHER_STAR"
    name: "&6&lInstrukcja Obsługi"
    lore:
      - "&7Schowek zapobiega noszeniu zbyt dużej"
      - "&7ilości przedmiotów leczących podczas walki."
      - ""
      - "&8» &eLPM &7- Dobierz do limitu"
      - "&8» &ePPM &7- Wypłać 1 sztukę"
      - "&8» &eShift + LPM &7- Wpłać ten przedmiot do schowka"

# Wiadomosci i komunikaty
